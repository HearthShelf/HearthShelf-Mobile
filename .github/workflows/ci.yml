name: CI

# Typecheck on every PR and push to main. This does NOT build or release - it is
# a fast correctness gate.
on:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # packages/core is a submodule

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # Narrow by design - currently only react-hooks/rules-of-hooks. A
      # conditional hook unmounts the screen at runtime and (without an error
      # boundary) reports nothing, so it must not reach a release. See
      # eslint.config.js for why the rest of the preset is off.
      - name: Lint
        run: npm run lint

      - name: Expo config resolves
        run: npx expo config --type public > /dev/null
