name: Release

# One release pipeline for BOTH platforms, driven solely by a pushed version tag.
# The tag fans out into two independent platform jobs - `android` and `ios` -
# that build, sign, and ship to their store in parallel. A shared `version` job
# resolves the single version string both platforms bake, so the Android .aab,
# the iOS IPA, the OTA runtimeVersion, and the website changelog all agree.
#
# Shape:
#   version -> android ┐
#           -> ios     ┴-> publish (GitHub Release + website changelog)
#
# The platform jobs do platform work ONLY. Everything that announces the release
# lives in `publish`, which needs BOTH platform jobs - so a release is only ever
# announced when both halves actually shipped, and a changelog failure can't
# red-flag an Android build that already uploaded to Play.
#
# Trigger: push tag '*.*.*'. The tag is the sole source of version truth; there
# is no manual dispatch path (a dispatch has no tag to version or to hang a
# GitHub Release on). To re-run a release, re-push the tag.
#
# Version model (identical on both platforms):
#   - user-facing `version` comes from the tag, v0.1.0 -> 0.1.0. Pre-release
#     labels normalize to the website's channel
#     tokens (v0.1.0-beta.1 -> 0.1.0-Beta1) so the changelog lands in the right
#     channel. That one string feeds EXPO_PUBLIC_APP_VERSION (baked app version +
#     OTA runtime) and the uploaded changelog version.
#   - build number = github.run_number on both platforms (Android versionCode /
#     iOS buildNumber). Strictly increasing, decoupled from semver, which is all
#     the stores require.
#
# Required repository secrets:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON, CHANGELOG_API_KEY
#   iOS:     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, IOS_DIST_P12_BASE64,
#            IOS_DIST_P12_PASSWORD, IOS_PROVISION_PROFILE_BASE64
#   Both:    SENTRY_AUTH_TOKEN (source-map + debug-symbol upload; optional -
#            without it builds still succeed but crash stacks stay minified)
#
# Sentry releases: NOT wired via the deploy webhook. The Sentry build plugin
# already creates the release entity and attaches source maps/symbols to it,
# named by the baked EXPO_PUBLIC_APP_VERSION - the same string Sentry.init
# reports as `release` at runtime. A webhook POST would create the release a
# second time with no artifacts attached, so it is deliberately not used.
on:
  push:
    tags: ['*.*.*']

jobs:
  # Resolve the version string once so both platform jobs bake the same value.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: resolve
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          VER=$(printf '%s' "$RAW" \
            | sed -E 's/-(beta|b)\.?([0-9]+)/-Beta\2/I' \
            | sed -E 's/-(alpha|a)\.?([0-9]+)/-Alpha\2/I' \
            | sed -E 's/-rc\.?([0-9]+)/-RC\1/I')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $VER (build ${{ github.run_number }})"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # changelog needs full history + tags for the diff range

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # RN 0.86 / Expo 57 request a Java 21 toolchain

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Fail early if the secret was empty/missing rather than producing a
          # broken build much later.
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty or missing"; exit 1; }

      - name: Prebuild (runs config plugins, incl. release signing)
        env:
          HEARTHSHELF_RELEASE_SIGNING: '1'
          HEARTHSHELF_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          HEARTHSHELF_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEARTHSHELF_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEARTHSHELF_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A release build embeds its JS by default, so standalone-js is not
          # needed here (that plugin only affects the DEBUG variant).
          EXPO_ANDROID_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
        run: npx expo prebuild --platform android --no-install

      # Fail fast if the baked version doesn't match what we resolved - catches a
      # broken resolver before shipping a mis-versioned OTA runtime. Buffers stdin
      # fully so a chunked --json response can't crash the assertion.
      - name: Assert baked version matches resolved version
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          BAKED=$(npx expo config --type public --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          echo "baked version: $BAKED (expected $APP_VERSION)"
          test "$BAKED" = "$APP_VERSION" \
            || { echo "::error::baked version $BAKED != resolved $APP_VERSION"; exit 1; }

      - name: Build signed .aab
        env:
          # Gradle maps ORG_GRADLE_PROJECT_X -> project property X, which is what
          # the injected signingConfig reads via providers.gradleProperty('X').
          ORG_GRADLE_PROJECT_HEARTHSHELF_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_HEARTHSHELF_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HEARTHSHELF_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HEARTHSHELF_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Expo's template jvmargs (2 GiB heap/512 MiB metaspace, in the
          # gitignored android/gradle.properties) OOMs the Gradle daemon during
          # :app:minifyReleaseWithR8 now that minification is on. GRADLE_OPTS
          # overrides it without depending on that file surviving prebuild.
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          # REQUIRED here, not just on prebuild: gradle runs the Metro bundle,
          # which re-evaluates app.config.js. Without this the config falls through
          # to its hardcoded `|| '0.0.2'` fallback and bakes extra.fullVersion=0.0.2
          # into the shipped bundle - so Sentry tagged every release's events as
          # "0.0.2" regardless of the real tag. (The assert step above passes
          # regardless: it re-runs `expo config` with this var set in its own env,
          # so it validates a value the actual bundle never saw.)
          EXPO_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
          # Source-map + debug-symbol upload to Sentry, run by the Sentry gradle
          # plugin during the release build. The release entity is created here,
          # named by the baked EXPO_PUBLIC_APP_VERSION above - the same string
          # Sentry.init reports as `release` at runtime, so events and artifacts
          # land on one release. Without the token the build still succeeds and the
          # app still reports crashes, they just arrive minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # --stacktrace surfaces the real exception (packageRelease wraps the cause
        # in IncrementalSplitterRunnable and hides it otherwise).
        run: ./gradlew :app:bundleRelease --stacktrace
        working-directory: android

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hearthshelf.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # Announce the release once BOTH platforms have shipped: GitHub Release (with
  # the .aab attached) plus the structured changelog POST to hearthshelf.com.
  # Deliberately NOT part of the android job - the platform jobs do platform work
  # only, so a red iOS build can't leave a published changelog claiming a release
  # that only half exists, and a changelog script failure can't red-flag an
  # Android build that already uploaded to Play.
  publish:
    # Both platform jobs must be green - `needs` alone gates this, no `if` guard.
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs full history + tags for the diff range

      - name: Download .aab artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab-${{ github.run_number }}
          path: release-assets

      # One chmod for the whole script dir - upload-changelog.sh shells out to
      # render-changelog.sh, which shells out to changelog-items.sh, so missing
      # any one of them fails the run with a bare "Permission denied" (126).
      - name: Make changelog scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Publish changelog to hearthshelf.com
        env:
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_API_URL: https://hearthshelf.com/api/v1/changelogs
          PRODUCT: HearthShelf-Mobile
          RELEASE_VERSION: ${{ env.APP_VERSION }}
          DOWNLOAD_URL: https://play.google.com/store/apps/details?id=com.hearthshelf.mobile
          # GITHUB_REF / GITHUB_REF_NAME are provided automatically.
        # Renders CHANGELOG.md as a side effect, which the Release body uses.
        run: .github/scripts/upload-changelog.sh

      # Safety net: upload-changelog.sh skips (exit 0) without CHANGELOG_API_KEY,
      # in which case no CHANGELOG.md was written. Render it directly so the
      # Release body is never empty.
      - name: Render changelog if the upload skipped
        env:
          PRODUCT: HearthShelf-Mobile
          RELEASE_VERSION: ${{ env.APP_VERSION }}
          DOWNLOAD_URL: https://play.google.com/store/apps/details?id=com.hearthshelf.mobile
        run: |
          test -f CHANGELOG.md || .github/scripts/render-changelog.sh CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HearthShelf Mobile ${{ env.APP_VERSION }}
          body_path: CHANGELOG.md
          files: release-assets/app-release.aab
          # A normalized pre-release label (Beta/Alpha/RC) marks the GitHub
          # Release as a pre-release too, matching the website's channel.
          prerelease: ${{ contains(env.APP_VERSION, '-') }}

      - name: Add changelog to run summary
        if: always()
        run: |
          if [ -f CHANGELOG.md ]; then cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"; fi

  ios:
    needs: version
    # macos-26: default Xcode 26.5 matches what the sim build uses; clerk-ios
    # needs Swift 6.2 tools (macos-15's default Xcode fails SPM resolution).
    runs-on: macos-26
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # packages/core is a submodule
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prebuild iOS project
        env:
          # The tag drives the version; run_number is the monotonic iOS build
          # number - matches Android's versionCode exactly.
          EXPO_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Decode signing assets
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$IOS_DIST_P12_BASE64" | base64 -d > fastlane/dist.p12
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > fastlane/profile.mobileprovision
          test -s fastlane/dist.p12 || { echo "::error::IOS_DIST_P12_BASE64 empty/missing"; exit 1; }
          test -s fastlane/profile.mobileprovision || { echo "::error::IOS_PROVISION_PROFILE_BASE64 empty/missing"; exit 1; }

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
          PROVISIONING_PROFILE_NAME: HearthShelf App Store
          # REQUIRED here, not just on prebuild: the Xcode "Bundle React Native
          # code and images" phase re-evaluates app.config.js. Without this the
          # config falls through to its hardcoded `|| '0.0.2'` fallback and bakes
          # extra.fullVersion=0.0.2 into the shipped bundle, so Sentry tagged every
          # release's events "0.0.2" regardless of the real tag.
          EXPO_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_IOS_BUILD_NUMBER: ${{ github.run_number }}
          # Source-map + dSYM upload, run by the Sentry Xcode build phase. Same
          # release name as Android (both bake EXPO_PUBLIC_APP_VERSION), so the
          # two platforms' artifacts land on one release entity. NOTE: unlike the
          # Android gradle plugin, this phase HARD-FAILS the build if the token is
          # missing (it exits nonzero) - see the ios-launch-check workflow, which
          # sets SENTRY_DISABLE_AUTO_UPLOAD=true because it has no token.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane ios release

      - name: Clean up signing assets
        if: always()
        run: rm -f fastlane/dist.p12 fastlane/profile.mobileprovision
